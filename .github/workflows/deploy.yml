name: Deploy

# Deploys the Worker from `main` so production never drifts from the source
# of truth. Gated by the `production` environment — configure a required
# reviewer there to keep deploys manual-approval until 56c ships.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy sentwise-inference
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - name: Lint, typecheck, test
        run: npm run lint && npm run typecheck && npm test
      - name: Rotate production Clerk secret
        run: |
          if [ -z "$CLERK_SECRET_KEY" ]; then
            echo "::error::Missing production CLERK_SECRET_KEY secret"
            exit 1
          fi

          case "$CLERK_SECRET_KEY" in
            sk_live_*) ;;
            *)
              echo "::error::Production CLERK_SECRET_KEY must be a live Clerk secret (sk_live_...)"
              exit 1
              ;;
          esac

          printf '%s' "$CLERK_SECRET_KEY" | npx wrangler secret put CLERK_SECRET_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke check
        run: curl -fsS https://sentwise-inference.sentwise-service.workers.dev/healthz
