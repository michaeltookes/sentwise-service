name: Deploy sandbox

# Deploys the sandbox Worker (sentwise-inference-sandbox): the same code as
# production, configured for the Paddle sandbox and a Clerk development
# instance (sentwise item 123; docs/sandbox-deployment.md). Dispatch only.
# The production workflow (deploy.yml) is separate and untouched by this one.
#
# Lockstep rule: deploy the same ref production runs (normally the head of
# main after a production deploy, or the same tag).
#
# Repository secrets (SANDBOX_ prefix, mapped to the production secret names
# at deploy time and uploaded with the deploy):
#   SANDBOX_CLERK_SECRET_KEY       -> CLERK_SECRET_KEY       (required, sk_test_…)
#   SANDBOX_ANTHROPIC_API_KEY      -> ANTHROPIC_API_KEY      (required)
#   SANDBOX_PADDLE_API_KEY         -> PADDLE_API_KEY         (required, sandbox key)
#   SANDBOX_PADDLE_WEBHOOK_SECRET  -> PADDLE_WEBHOOK_SECRET  (required, pdl_ntfset_…)
#   SANDBOX_ADMIN_TOKEN            -> ADMIN_TOKEN            (optional)
#   SANDBOX_CF_ANALYTICS_API_TOKEN -> CF_ANALYTICS_API_TOKEN (optional)
#   SANDBOX_ANALYTICS_HASH_KEY     -> ANALYTICS_HASH_KEY     (optional)
# Plus the existing CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment to update"
        required: true
        type: choice
        options: [sandbox]
        default: sandbox
      ref:
        description: "Git ref to deploy (use the same ref production runs)"
        required: true
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: deploy-sandbox
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy sentwise-inference-sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - name: Lint, typecheck, test
        run: npm run lint && npm run typecheck && npm test
      - name: Build the sandbox secrets file
        env:
          CLERK_SECRET_KEY: ${{ secrets.SANDBOX_CLERK_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.SANDBOX_ANTHROPIC_API_KEY }}
          PADDLE_API_KEY: ${{ secrets.SANDBOX_PADDLE_API_KEY }}
          PADDLE_WEBHOOK_SECRET: ${{ secrets.SANDBOX_PADDLE_WEBHOOK_SECRET }}
          ADMIN_TOKEN: ${{ secrets.SANDBOX_ADMIN_TOKEN }}
          CF_ANALYTICS_API_TOKEN: ${{ secrets.SANDBOX_CF_ANALYTICS_API_TOKEN }}
          ANALYTICS_HASH_KEY: ${{ secrets.SANDBOX_ANALYTICS_HASH_KEY }}
        run: |
          missing=0
          for name in CLERK_SECRET_KEY ANTHROPIC_API_KEY PADDLE_API_KEY PADDLE_WEBHOOK_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret SANDBOX_${name}"
              missing=1
            fi
          done
          [ "$missing" = 0 ] || exit 1

          # Never let a production credential reach the sandbox Worker.
          case "$CLERK_SECRET_KEY" in
            sk_test_*) ;;
            *) echo "::error::SANDBOX_CLERK_SECRET_KEY must be a Clerk development key (sk_test_...)"; exit 1 ;;
          esac
          case "$PADDLE_API_KEY" in
            *_live_*) echo "::error::SANDBOX_PADDLE_API_KEY is a live Paddle key"; exit 1 ;;
          esac

          umask 077
          file="$RUNNER_TEMP/sandbox-secrets.json"
          # Include empty optional values to overwrite previously deployed secrets.
          # Wrangler preserves any secrets omitted from --secrets-file.
          jq -n \
            --arg CLERK_SECRET_KEY "$CLERK_SECRET_KEY" \
            --arg ANTHROPIC_API_KEY "$ANTHROPIC_API_KEY" \
            --arg PADDLE_API_KEY "$PADDLE_API_KEY" \
            --arg PADDLE_WEBHOOK_SECRET "$PADDLE_WEBHOOK_SECRET" \
            --arg ADMIN_TOKEN "$ADMIN_TOKEN" \
            --arg CF_ANALYTICS_API_TOKEN "$CF_ANALYTICS_API_TOKEN" \
            --arg ANALYTICS_HASH_KEY "$ANALYTICS_HASH_KEY" \
            '$ARGS.named' > "$file"
          echo "SANDBOX_SECRETS_FILE=$file" >> "$GITHUB_ENV"
      - name: Deploy
        run: bash scripts/deploy-sandbox.sh --secrets-file "$SANDBOX_SECRETS_FILE"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Remove the secrets file
        if: always()
        run: rm -f "$RUNNER_TEMP/sandbox-secrets.json"
      - name: Smoke check
        run: curl -fsS https://sentwise-inference-sandbox.sentwise-service.workers.dev/healthz
